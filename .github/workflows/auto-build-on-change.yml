name: Publish Docker images

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - justfile
      - .github/workflows/auto-build-on-change.yml
      - .github/workflows/build-image.yml
  # Build and test only, see the publish input below.
  pull_request:
    paths:
      - Dockerfile
      - justfile
      - .github/workflows/auto-build-on-change.yml
      - .github/workflows/build-image.yml

# Jobs opt into the permissions they need.
permissions: {}

concurrency:
  # Pull requests get their own group, so they never hold back or cancel a publish run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }}
    strategy:
      # A variant that fails to build must not stop the others from being published.
      fail-fast: false
      matrix:
        include:
          - image: caddy-cloudflare
            modules: >-
              github.com/caddy-dns/cloudflare
          - image: caddy-cloudflare-l4
            modules: >-
              github.com/caddy-dns/cloudflare
              github.com/mholt/caddy-l4
    # Upper bound for the jobs in build-image.yml, which narrow it down per job.
    permissions:
      packages: write # push images to GHCR and attach the attestation to them
      contents: read
      attestations: write # create the build provenance attestation
      id-token: write # mint the OIDC token the attestation is signed with
    uses: $/.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      modules: ${{ matrix.modules }}
      publish: ${{ github.event_name != 'pull_request' }}
    # Reusable workflows get no secrets unless passed.
    # Environment secrets can't be passed explicitly,
    # and the called workflow lives in this repo, so inherit is fine.
    secrets: inherit # zizmor: ignore[secrets-inherit]
