name: Build image

# Called once per variant from auto-build-on-change.yml.
# Checks one image variant for updates of Caddy, its base image, Go or a module and, if needed,
# builds and tests it on every platform and then publishes it.
on:
  workflow_call:
    inputs:
      image:
        description: Image name without registry or owner, e.g. caddy-cloudflare
        required: true
        type: string
      modules:
        description: Space-separated Go module paths to build into Caddy
        required: true
        type: string
      caddy-version:
        description: Exact Caddy version to build, e.g. 2.11.9
        required: true
        type: string
      build-time:
        description: UTC build time as YYYYMMDD.HHMM, for the immutable tag, e.g. 20261126.0420
        required: true
        type: string
      publish:
        description: Push the image to the registries after the tests passed
        required: false
        type: boolean
        default: false

# Jobs opt into the permissions they need.
permissions: {}

env:
  DOCKERHUB_REPO: lewimbes/${{ inputs.image }}
  GHCR_REPO: ghcr.io/lewimbes/${{ inputs.image }}
  # Records everything the published image was built from (see `just build-inputs`).
  BUILD_INPUTS_LABEL: io.github.lewimbes.caddy-images.build-inputs

jobs:
  check-updates:
    name: Check for updates
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    outputs:
      needs-updating: ${{ steps.check.outputs.needs-updating }}
      modules: ${{ steps.check.outputs.modules }}
      build-inputs: ${{ steps.check.outputs.build-inputs }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: just

      # The modules are pinned here, so the tests, the published image and its label all use the same versions.
      - name: Compare build inputs with the published image
        id: check
        env:
          IMAGE: ${{ inputs.image }}
          MODULES: ${{ inputs.modules }}
          CADDY_VERSION: ${{ inputs.caddy-version }}
        run: |
          set -euo pipefail
          modules=$(just resolve-modules "$MODULES")
          current=$(just build-inputs "$modules" "$CADDY_VERSION")
          # Empty if the image or its label doesn't exist yet, which counts as an update.
          published=$(docker buildx imagetools inspect "$GHCR_REPO:latest" --format '{{json .Image}}' 2>/dev/null |
            jq -r --arg label "$BUILD_INPUTS_LABEL" '."linux/amd64".config.Labels[$label] // ""' || true)
          changed=$(comm -13 <(tr ' ' '\n' <<< "$published" | sort) <(tr ' ' '\n' <<< "$current" | sort) | paste -sd ' ' -)
          if [ "$current" = "$published" ]; then needs_updating=false; else needs_updating=true; fi
          {
            echo "modules=$modules"
            echo "build-inputs=$current"
            echo "needs-updating=$needs_updating"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $IMAGE"
            echo "- Published: \`${published:-none}\`"
            echo "- Current: \`$current\`"
            echo "- Changed: \`${changed:-nothing}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Changed build inputs: ${changed:-nothing}"

  test:
    name: Test (${{ matrix.arch }})
    needs: check-updates
    # Run if it's a manual trigger, a code push or pull request, or if any build input changed
    if: github.event_name != 'schedule' || needs.check-updates.outputs.needs-updating == 'true'
    strategy:
      matrix:
        # Native runners, so each image is built and run without emulation.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: just

      - name: Build image
        env:
          MODULES: ${{ needs.check-updates.outputs.modules }}
          CADDY_VERSION: ${{ inputs.caddy-version }}
        run: just build "$MODULES" "$CADDY_VERSION"

      - name: Test image
        env:
          MODULES: ${{ needs.check-updates.outputs.modules }}
          CADDY_VERSION: ${{ inputs.caddy-version }}
        run: just test "$MODULES" "$CADDY_VERSION"

  build-and-push:
    name: Build and Push Docker image
    needs: [check-updates, test]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      packages: write # push images to GHCR and attach the attestation to them
      contents: read
      attestations: write # create the build provenance attestation
      id-token: write # mint the OIDC token the attestation is signed with

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels, annotations) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR reads the description of a multi-arch image from the index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          # Every build is the latest Caddy.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.caddy-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.caddy-version }}
            type=semver,pattern={{major}},value=${{ inputs.caddy-version }}
            type=raw,value=latest
            # Never moves, so a build can be pinned and rolled back to, e.g. 2.11.9-20261126.0420.
            type=raw,value=${{ inputs.caddy-version }}-${{ inputs.build-time }}
          # Defaults would use the repository name and description, which cover all variants.
          # The vendor would otherwise be inherited from the official Caddy image.
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=Caddy with ${{ inputs.modules }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            ${{ env.BUILD_INPUTS_LABEL }}=${{ needs.check-updates.outputs.build-inputs }}
          annotations: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=Caddy with ${{ inputs.modules }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            CADDY_MODULES=${{ needs.check-updates.outputs.modules }}
            CADDY_VERSION=${{ inputs.caddy-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Attached to the image in the registry, next to the GitHub attestation below.
          sbom: true
          provenance: mode=max

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
