name: Build image

# Called once per variant from auto-build-on-change.yml.
# Checks one image variant for base image updates and, if needed,
# builds and tests it on every platform and then publishes it.
on:
  workflow_call:
    inputs:
      image:
        description: Image name without registry or owner, e.g. caddy-cloudflare
        required: true
        type: string
      modules:
        description: Space-separated Go module paths to build into Caddy
        required: true
        type: string
      publish:
        description: Push the image to the registries after the tests passed
        required: false
        type: boolean
        default: false

# Jobs opt into the permissions they need.
permissions: {}

env:
  DOCKERHUB_REPO: lewimbes/${{ inputs.image }}
  GHCR_REPO: ghcr.io/lewimbes/${{ inputs.image }}

jobs:
  check-updates:
    name: Check for base image updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # list GHCR container versions to detect already-published tags
    outputs:
      needs-updating: ${{ steps.check.outputs.needs-updating }}
    steps:
      - name: Check if Caddy base image updated
        id: check
        uses: lucacome/docker-image-update-checker@a9613235d22dc951741aef2b6301da8db05ea5f6 # v3.1.3
        with:
          base-image: caddy:latest
          image: ${{ env.DOCKERHUB_REPO }}:latest

  test:
    name: Test (${{ matrix.arch }})
    needs: check-updates
    # Run if it's a manual trigger, a code push or pull request, or if the update checker found a new base image
    if: github.event_name != 'schedule' || needs.check-updates.outputs.needs-updating == 'true'
    strategy:
      matrix:
        # Native runners, so each image is built and run without emulation.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: just

      - name: Build image
        env:
          MODULES: ${{ inputs.modules }}
        run: just build "$MODULES"

      - name: Test image
        env:
          MODULES: ${{ inputs.modules }}
        run: just test "$MODULES"

  build-and-push:
    name: Build and Push Docker image
    needs: test
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      packages: write # push images to GHCR and attach the attestation to them
      contents: read
      attestations: write # create the build provenance attestation
      id-token: write # mint the OIDC token the attestation is signed with

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Fetch Caddy version
        id: caddy
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/docker-library/official-images/master/library/caddy'
          ver=$(curl -fsSL "$url" | grep -m1 '^Tags:' | \
              sed -E 's/Tags:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          {
            echo "full=$ver"
            echo "major_minor=${ver%.*}"
            echo "major=${ver%%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved Caddy version → $ver"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=${{ steps.caddy.outputs.full }}
            type=raw,value=${{ steps.caddy.outputs.major_minor }}
            type=raw,value=${{ steps.caddy.outputs.major }}
            type=raw,value=latest
          # Defaults would use the repository name and description, which cover all variants.
          labels: |
            org.opencontainers.image.title=${{ inputs.image }}
            org.opencontainers.image.description=Caddy with ${{ inputs.modules }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            CADDY_MODULES=${{ inputs.modules }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
