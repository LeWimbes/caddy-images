name: Publish Docker images

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - justfile
      - .github/workflows/auto-build-on-change.yml
      - .github/workflows/build-image.yml
  # Build and test only, see the publish input below.
  pull_request:
    paths:
      - Dockerfile
      - justfile
      - .github/workflows/auto-build-on-change.yml
      - .github/workflows/build-image.yml

# Jobs opt into the permissions they need.
permissions: {}

concurrency:
  # Pull requests get their own group, so they never hold back or cancel a publish run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve Caddy version and build time
    runs-on: ubuntu-latest
    outputs:
      caddy-version: ${{ steps.resolve.outputs.version }}
      build-time: ${{ steps.build-time.outputs.time }}
    steps:
      # Resolved once, so all images are built from the same version. caddy:latest is only
      # updated once the official images are published, so caddy:<version>(-builder) exist.
      - name: Read the Caddy version of caddy:latest
        id: resolve
        run: |
          set -euo pipefail
          ver=$(docker buildx imagetools inspect caddy:latest --format '{{json .Image}}' |
            jq -r '."linux/amd64".config.Env[] | select(startswith("CADDY_VERSION=")) | ltrimstr("CADDY_VERSION=v")')
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Caddy version: '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved Caddy version → $ver"

      # Also resolved once, so all images built in this run share their immutable tag.
      - name: Get the build time
        id: build-time
        run: echo "time=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }}
    needs: resolve
    strategy:
      # A variant that fails to build must not stop the others from being published.
      fail-fast: false
      matrix:
        include:
          - image: caddy-cloudflare
            modules: >-
              github.com/caddy-dns/cloudflare
          - image: caddy-cloudflare-l4
            modules: >-
              github.com/caddy-dns/cloudflare
              github.com/mholt/caddy-l4
    # Upper bound for the jobs in build-image.yml, which narrow it down per job.
    permissions:
      packages: write # push images to GHCR and attach the attestation to them
      contents: read
      attestations: write # create the build provenance attestation
      id-token: write # mint the OIDC token the attestation is signed with
    uses: $/.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      modules: ${{ matrix.modules }}
      caddy-version: ${{ needs.resolve.outputs.caddy-version }}
      build-time: ${{ needs.resolve.outputs.build-time }}
      publish: ${{ github.event_name != 'pull_request' }}
    # Reusable workflows get no secrets unless passed.
    # Environment secrets can't be passed explicitly,
    # and the called workflow lives in this repo, so inherit is fine.
    secrets: inherit # zizmor: ignore[secrets-inherit]
